<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Compostagem</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>♻️ Jogo da Compostagem</h1>
  <p>Arraste os itens para o lugar certo!</p>

  <div id="game">
    <div id="items" class="area"></div>

    <div class="bins">
      <div id="composteira" class="bin">Composteira</div>
      <div id="lixo" class="bin">Lixo Comum</div>
    </div>
  </div>

  <div id="score">Pontos: 0</div>
  <div id="message"></div>

  <button id="resetBtn">🔄 Reiniciar Jogo</button>

  <div id="gameOver" class="hidden">
    <div class="overlay"></div>
    <div class="gameover-box">
      <h2>💀 Você perdeu!</h2>
      <p>Um descarte errado contaminou tudo!</p>
      <button id="restartGame">Tentar novamente</button>
    </div>
  </div>

    <div id="victory" class="hidden">
    <div class="overlay"></div>
    <div class="victory-box">
      <h2>🎉 Parabéns! Você ganhou um pirulito! 🍭</h2>
      <div class="lollipop"></div>
      <button id="playAgain">Jogar novamente</button>
    </div>
  </div>
  <footer>Feito por alunos do CEP — Amostra de Química 3K</footer>

  <script src="script.js"></script>
</body>
</html>
